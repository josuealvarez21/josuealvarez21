<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2" viewBox="0 0 1200 2" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0" />
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="1" y="0.5" fill="#16241F" />
  <rect width="260" height="2" fill="url(#shine)">
    <animate attributeName="x" from="-260" to="1200" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
